# 第 10 课判据「推送即构建」：把 make check 的等效入口挂到每次推送。
#
# 与本地 `make check` 一一对应：
#   check-security  → SEC-05 密钥扫描 + SEC-06 依赖基线
#   check-async     → 第 8 课三条判据
#   check-apitest   → 第 9 课注入三件套
#   check-audit     → SEC-07 审计七列结构断言
#   check-observe   → 第 10 课运行观测告警判定
#   check-compose   → 容器配置静态校验（不需要 Docker）
#
# 任一步非零退出即整体失败，主干因此进不去坏提交。
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: 门禁（安全 / 异步 / 注入 / 审计 / 观测 / 容器）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖（按锁文件，验证可复现）
        run: uv sync --locked

      # 仓库不含 data/ 与 *.db（.gitignore 排除），干净 runner 上本来没有库。
      # 少了这一步，下面「SEC-07 审计七列结构断言」与「运行观测告警判定」会因为
      # 库不存在而直接 return 0——步骤显示绿色，断言和规则却一条都没跑。
      # 这里按应用启动时的同一套 schema 建出结构，只建表不灌数据。
      - name: 初始化数据库结构（否则审计与观测两步空转）
        run: uv run python scripts/init_schema.py --db data/app.db

      - name: SEC-05 密钥扫描 + SEC-06 依赖基线
        run: uv run python scripts/check_security.py --out reports/evidence/security-baseline.json

      - name: 第 8 课三条判据
        run: uv run python scripts/acceptance_async.py --out reports/evidence/async-acceptance.json

      - name: 第 9 课注入三件套
        run: uv run python apitest/run_all.py --no-report

      - name: SEC-07 审计七列结构断言
        run: >-
          uv run python scripts/audit_recheck.py
          --db data/app.db --out reports/audit-recheck.md --allow-empty

      - name: 第 10 课运行观测告警判定
        run: >-
          uv run python scripts/check_observe.py
          --db data/app.db --out reports/evidence/observe.json

      # 容器配置静态校验：悬空依赖、COPY 缺源、端口不符、镜像版本越界。
      # 这些错误不需要 Docker 就能查，放在 CI 里挡住「配置写完就提」的提交。
      - name: 容器配置静态校验
        run: uv run python scripts/check_compose.py --out reports/evidence/compose-static.json

      # 判据「推送即构建」的最后一环：流程执行、测试通过之后必须真的产出镜像。
      # 放在测试之后是有意的——门禁没绿就构建出一个镜像，等于给坏提交发通行证。
      # 标签用提交 SHA，编号因此能反查提交；REVISION 标签写进镜像元数据，
      # 镜像离开仓库后仍能回答「这是哪次提交做的」。
      - name: 构建镜像（campusclaw:${GITHUB_SHA}）
        run: |
          set -eu
          IMAGE="campusclaw:${GITHUB_SHA}"
          docker build \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "${IMAGE}" \
            -t "campusclaw:run-${GITHUB_RUN_NUMBER}" \
            .
          docker image inspect "${IMAGE}" --format '镜像 ID {{.Id}}，大小 {{.Size}} 字节'
          REVISION="$(docker image inspect "${IMAGE}" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          echo "镜像内 revision 标签：${REVISION}"
          test "${REVISION}" = "${GITHUB_SHA}"
          # 冒烟：镜像里的代码能导入，至少证明依赖装齐、包没漏进 COPY。
          docker run --rm "${IMAGE}" python -c "import campusclaw; print('import ok')"
          {
            echo "### 镜像已产出"
            echo ""
            echo "- 标签：\`${IMAGE}\`、\`campusclaw:run-${GITHUB_RUN_NUMBER}\`"
            echo "- 反查提交：\`${GITHUB_SHA}\`（镜像 \`org.opencontainers.image.revision\` 同值）"
            echo "- 镜像 ID / 大小：\`$(docker image inspect "${IMAGE}" --format '{{.Id}} {{.Size}}')\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 归档证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-evidence
          path: |
            reports/evidence/
            reports/audit-recheck.md
          if-no-files-found: warn
