name: publish-ghcr

on:
  workflow_run:
    workflows: ["check"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/perry-xwr/campus-claw

jobs:
  publish:
    name: Build, publish and smoke test
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          build-args: |
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
            BUILD_TIME=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify digest, source revision and isolated health check
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_NAME}@${DIGEST}"
          docker pull "${IMAGE_REF}"

          IMAGE_REVISION="$(docker image inspect "${IMAGE_REF}" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "${IMAGE_REVISION}" = "${REVISION}"
          docker image inspect "${IMAGE_REF}" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "@${DIGEST}"

          CONTAINER="campusclaw-ghcr-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm --force "${CONTAINER}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "${CONTAINER}" \
            --publish 127.0.0.1:18080:8080 \
            --env CAMPUSCLAW_HOME=/tmp/campusclaw-ghcr-smoke \
            --env SECRET_KEY=ci-only-smoke-secret \
            "${IMAGE_REF}"

          ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "${CONTAINER}")" != "true" ]; then
              docker logs "${CONTAINER}"
              exit 1
            fi
            sleep 1
          done
          if [ "${ready}" != "true" ]; then
            docker logs "${CONTAINER}"
            echo "Container /health did not return success within 45 seconds" >&2
            exit 1
          fi

          {
            echo "### GHCR image published and verified"
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Revision: \`${IMAGE_REVISION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Isolated container health: \`/health = 200\`"
          } >> "${GITHUB_STEP_SUMMARY}"
