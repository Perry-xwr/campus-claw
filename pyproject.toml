[project]
name = "campusclaw"
version = "0.1.0"
description = "班级教学材料管理与可追溯知识库检索（互联网开发课程项目）"
readme = "README.md"
# 锁定 3.11：与既有验收环境（anaconda langdev，Python 3.11.15）一致。
# 容器镜像同为 python:3.11-slim——本地、门禁、容器跑同一个解释器版本。
requires-python = ">=3.11,<3.12"

dependencies = [
    # 2026-11-12 SEC-06：修复 PYSEC-2026-2151 / PYSEC-2026-4312 两条已知漏洞。
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
    "bcrypt==4.2.1",
    # gunicorn 仅用于容器（linux）；Windows 上装得上但无法运行。
    "gunicorn==23.0.0; sys_platform != 'win32'",
    "langchain-openai==1.4.1",
    "langchain-text-splitters==1.1.3",
    # 与服务端镜像 qdrant/qdrant:v1.15.5 同次版本（客户端要求次版本差 ≤1），
    # 由 scripts/check_compose.py 的 qdrant.version 项静态把关。
    "qdrant-client==1.15.1",
    # 第 6 课：MCP 与工具接入。mcp 供 mcp-server（FastMCP），
    # langchain-mcp-adapters 供主机侧作传输客户端，uvicorn 运行 mcp-server。
    # 三者版本敏感（FastMCP 的 stateless_http / json_response 行为随版本变化），勿随意放宽。
    "mcp==1.30.0",
    "langchain-mcp-adapters==0.3.2",
    "uvicorn==0.54.0",
]

[tool.uv]
# 项目本身不作为可安装包发布：app.py / campusclaw 包 / mcp-server 均以源码目录直跑。
package = false

[dependency-groups]
# 门禁脚本 scripts/check_compose.py 直接 import yaml 解析 docker-compose.yml。
# 此前它只是被别的包顺带装进来的传递依赖：一旦上游把这个依赖去掉，
# 门禁会在 CI 上以「缺 pyyaml」的形式红，而报错和真正的配置错误混在一起。
# 显式声明为开发依赖，不进运行时镜像（requirements.txt 不含它）。
dev = [
    "PyYAML==6.0.3",
]

# 迁移到 uv 时（2026-11-04）为「依赖树与既有验收环境一致」而加的传递依赖约束。
# 这些是 anaconda langdev 环境中实测通过的版本；不新增依赖，只锁定解析结果。
# 依据：mcp 1.30 的 FastMCP 与 langchain 1.x 对 starlette / pydantic / langchain-core
# 的小版本变化敏感，放任解析会改变 MCP 服务的运行时行为。
# 需要升级某个包时，改这里并重新跑 apitest 与验收脚本。
constraint-dependencies = [
    "anyio==4.14.2",
    "certifi==2026.7.22",
    "cffi==2.1.0",
    "charset-normalizer==3.4.9",
    "cryptography==49.0.0",
    "grpcio==1.84.0",
    "idna==3.18",
    "jiter==0.16.0",
    "jsonpatch==1.33",
    "jsonpointer==3.1.1",
    "langchain-core==1.5.2",
    "langchain-protocol==0.0.18",
    "langsmith==0.10.11",
    "openai==2.50.0",
    "orjson==3.11.9",
    "packaging==26.2",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.16.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "regex==2026.7.19",
    "sse-starlette==3.5.0",
    "starlette==1.8.0",
    "tenacity==9.1.4",
    "tiktoken==0.13.0",
    "tqdm==4.70.0",
    "typing-inspection==0.4.2",
    "urllib3==2.7.0",
    "uuid-utils==0.17.0",
    "websockets==15.0.1",
    "xxhash==3.8.1",
]
