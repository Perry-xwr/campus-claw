# 项目名固定为 campusclaw：默认会取所在文件夹名（大小写不敏感），
# 一旦项目根目录改名，卷/网络会被当成新项目重建，Qdrant 已有向量就会"消失"。
# 固定后无论目录叫 campusClaw 还是 campus-claw，都复用 campusclaw_qdrant_data。
name: campusclaw

services:
  app:
    build: .
    image: campusclaw:latest
    container_name: campusclaw-app
    environment:
      # 全部留空时应用会回落到内置测试凭据（见 README「预置账号」），
      # 因此本文件不存在也能 `docker compose up` 直接跑起来。
      # 若项目根目录放了 .env，Compose 会自动读取其中的同名变量填进下面各项。
      SECRET_KEY: "${SECRET_KEY:-}"
      SEED_TEACHER_A_PASSWORD: "${SEED_TEACHER_A_PASSWORD:-}"
      SEED_STUDENT_A1_PASSWORD: "${SEED_STUDENT_A1_PASSWORD:-}"
      SEED_STUDENT_B1_PASSWORD: "${SEED_STUDENT_B1_PASSWORD:-}"
      SEED_TEACHER_B_PASSWORD: "${SEED_TEACHER_B_PASSWORD:-}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      CAMPUSCLAW_STRICT_CONFIG: "${CAMPUSCLAW_STRICT_CONFIG:-}"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-campusclaw_chunks}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      CHAT_BASE_URL: "${CHAT_BASE_URL:-}"
      CHAT_MODEL: "${CHAT_MODEL:-}"
      CHAT_API_KEY: "${CHAT_API_KEY:-}"
    ports:
      # 只想改宿主机端口时：设置 CAMPUSCLAW_PORT=8090 后再 up。
      - "${CAMPUSCLAW_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      - qdrant
    healthcheck:
      # 仅用容器内标准库探测，不依赖 curl。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
  worker:
    build: .
    image: campusclaw:latest
    command: ["python", "-m", "campusclaw.index_worker"]
    environment:
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-campusclaw_chunks}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      SECRET_KEY: "${SECRET_KEY:-}"
      SEED_TEACHER_A_PASSWORD: "${SEED_TEACHER_A_PASSWORD:-}"
      SEED_STUDENT_A1_PASSWORD: "${SEED_STUDENT_A1_PASSWORD:-}"
      SEED_STUDENT_B1_PASSWORD: "${SEED_STUDENT_B1_PASSWORD:-}"
      SEED_TEACHER_B_PASSWORD: "${SEED_TEACHER_B_PASSWORD:-}"
      CAMPUSCLAW_STRICT_CONFIG: "${CAMPUSCLAW_STRICT_CONFIG:-}"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    depends_on:
      app:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  mcp:
    build: .
    image: campusclaw:latest
    # 第 6 课：自建 MCP 工具服务。与主应用同镜像、不同 command；
    # 令牌经环境变量注入（项目根 .env 的 MCP_AUTH_TOKEN），不写死在文件或镜像层。
    command: ["python", "-m", "mcp_server"]
    working_dir: /app/mcp-server
    environment:
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"
    ports:
      # 教师登记 Base URL 时，容器网络内填 http://mcp:8090，宿主机调试用 127.0.0.1:8090。
      # 只想改宿主机端口时：设置 MCP_PORT=8091 后再 up。
      - "127.0.0.1:${MCP_PORT:-8090}:8090"
    # 不设 depends_on：不拦 app 启动；连接失败由主机侧返回 502 可读提示。
    restart: unless-stopped
volumes:
  qdrant_data:
